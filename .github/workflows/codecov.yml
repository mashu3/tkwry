name: Coverage

# Dedicated Win + macOS coverage uploads (Codecov flags).
# Editable install (maturin develop) so coverage paths match the repo — a plain
# wheel under site-packages uploads as ~0% on Codecov (tkface uses editable too).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (${{ matrix.flag }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flag: macos
            script: scripts/run-macos-ci-tests.sh
          - os: windows-latest
            flag: windows
            script: scripts/run-windows-ci-tests.sh
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # maturin develop requires a real venv (VIRTUAL_ENV / .venv). setup-python
      # alone is not enough on GHA.
      - name: Editable install in .venv (coverage paths = checkout)
        shell: bash
        env:
          PKG_CONFIG_PATH: ""
        run: |
          python -m venv .venv
          if [[ -f .venv/Scripts/activate ]]; then
            # Windows (bash)
            source .venv/Scripts/activate
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            source .venv/bin/activate
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-cov
          maturin develop --profile ci
          python -c "import tkwry, pathlib; print(pathlib.Path(tkwry.__file__).resolve())"

      - name: Configure Tcl/Tk (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TCL_LIBRARY=${pythonLocation}/tcl/tcl8.6" >> "$GITHUB_ENV"
          echo "TK_LIBRARY=${pythonLocation}/tcl/tk8.6" >> "$GITHUB_ENV"

      - name: Sanity — tkwry resolves into the checkout
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import tkwry
          import tkwry.webview as wv

          root = pathlib.Path.cwd().resolve()
          for label, mod in (("tkwry", tkwry), ("webview", wv)):
              path = pathlib.Path(mod.__file__).resolve()
              print(f"{label}: {path}")
              if root not in path.parents and path.parent != root:
                  raise SystemExit(f"{label} is not under checkout: {path}")
          print("ok: imports resolve into the git tree")
          PY

      - name: Run tests with coverage
        shell: bash
        env:
          TK_SILENCE_DEPRECATION: "1"
          PYTHONUNBUFFERED: "1"
          TKWRY_COVERAGE: "1"
        run: bash ${{ matrix.script }}

      - name: Sanity — coverage.xml points at checkout (not site-packages)
        shell: bash
        run: |
          test -f coverage.xml
          grep -q 'filename="webview.py"' coverage.xml
          if ! grep -E '<source>[^<]*[/\\]tkwry</source>' coverage.xml >/dev/null; then
            echo "::error::coverage.xml <source> is not checkout tkwry/"
            grep -E '<source>' coverage.xml || true
            exit 1
          fi
          if grep -E '<source>[^<]*site-packages[/\\]tkwry</source>' coverage.xml >/dev/null; then
            echo "::error::coverage.xml <source> is site-packages — use maturin develop"
            grep -E '<source>' coverage.xml || true
            exit 1
          fi
          grep -E '<source>' coverage.xml
          echo "line-rate sample:" 
          grep -o 'line-rate="[^"]*"' coverage.xml | head -n 3

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: ${{ matrix.flag }}
          name: ${{ matrix.flag }}
          fail_ci_if_error: true
          verbose: true
