# Codecov — separate macOS / Windows uploads (flags). Do not fail PRs on %.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: macos
      carryforward: true
    - name: windows
      carryforward: true
