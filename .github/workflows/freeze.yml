# Flagship freeze smoke (packaging).
#
# Manual only — not on push, not on tags. Run from Actions → Freeze →
# "Run workflow" when you want a Win/mac PyInstaller check.
#
# Serial per OS: onedir (assert native tkwry._core on disk) then onefile
# (build succeeds; binary present). No GUI launch.
#
# macOS: onedir uses --windowed (.app). onefile omits --windowed —
# PyInstaller deprecates windowed+onefile on macOS (error in v7).
name: Freeze

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyinstaller:
    name: PyInstaller (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x86_64
            os: windows-latest
            onedir_ui: --noconsole
            onefile_ui: --noconsole
          - id: macos-arm64
            os: macos-latest
            onedir_ui: --windowed
            # No --windowed: onefile + .app is deprecated (PyInstaller ≥6.22).
            onefile_ui: ""
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build and install tkwry (wheel)
        shell: bash
        env:
          PKG_CONFIG_PATH: ""
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          maturin build --profile ci --out dist-wheel
          pip install dist-wheel/*.whl
          # Checkout has a source ``tkwry/`` without ``_core``; importing from
          # the workspace would shadow the wheel (same pattern as ci.yml).
          cd "${RUNNER_TEMP}"
          python -c "import tkwry, tkwry._core; print(tkwry.__version__, tkwry._core)"

      - name: Install PyInstaller
        shell: bash
        # Pin to the version that passed Freeze smoke (bump deliberately).
        run: pip install "pyinstaller==6.22.2"

      - name: Freeze flagship (onedir)
        shell: bash
        env:
          FREEZE_UI: ${{ matrix.onedir_ui }}
        run: |
          # Analyze outside the checkout so PyInstaller collects the installed
          # wheel (with native ``_core``), not the source tree.
          cd "${RUNNER_TEMP}"
          # shellcheck disable=SC2086
          pyinstaller \
            ${FREEZE_UI} \
            --noconfirm \
            --onedir \
            --collect-submodules tkwry \
            --name tkwry-browser \
            --distpath "${GITHUB_WORKSPACE}/dist" \
            --workpath "${GITHUB_WORKSPACE}/build-onedir" \
            --specpath "${GITHUB_WORKSPACE}" \
            "${GITHUB_WORKSPACE}/examples/tkwry_browser.py"

      - name: Assert native tkwry._core in onedir artifact
        shell: bash
        run: python scripts/check_freeze_artifact.py dist

      - name: Freeze flagship (onefile)
        shell: bash
        env:
          FREEZE_UI: ${{ matrix.onefile_ui }}
        run: |
          cd "${RUNNER_TEMP}"
          # Distinct --name so this does not clash with onedir's
          # dist/tkwry-browser/ (or .app) from the previous step.
          # shellcheck disable=SC2086
          pyinstaller \
            ${FREEZE_UI} \
            --noconfirm \
            --onefile \
            --collect-submodules tkwry \
            --name tkwry-browser-onefile \
            --distpath "${GITHUB_WORKSPACE}/dist" \
            --workpath "${GITHUB_WORKSPACE}/build-onefile" \
            --specpath "${GITHUB_WORKSPACE}" \
            "${GITHUB_WORKSPACE}/examples/tkwry_browser.py"

      - name: Assert onefile binary exists
        shell: bash
        run: |
          # One-file packs ``_core`` inside the archive; existence + successful
          # build is the smoke (onedir step already asserted the native module).
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -f dist/tkwry-browser-onefile.exe
            ls -la dist/tkwry-browser-onefile.exe
          else
            test -f dist/tkwry-browser-onefile
            ls -la dist/tkwry-browser-onefile
          fi

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: freeze-${{ matrix.id }}
          path: |
            dist/tkwry-browser/
            dist/tkwry-browser.app/
            dist/tkwry-browser-onefile.exe
            dist/tkwry-browser-onefile
          if-no-files-found: error
          retention-days: 14
