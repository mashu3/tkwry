name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Check version consistency
        id: version
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version OK: $CARGO_VERSION"
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

  # Tag pushes do not run ci.yml on their own (branches: [main] only).
  # Reuse the full lint + platform matrix before any publish path.
  quality:
    name: Quality gates
    needs: [check-version]
    uses: ./.github/workflows/ci.yml

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheel (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            smoke: native
          - id: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            smoke: native
          - id: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            smoke: native
          - id: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            # Cross-built on Apple Silicon; smoke under Rosetta when available.
            smoke: rosetta
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist

      - name: Smoke-test wheel import
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SMOKE_DIR="${RUNNER_TEMP}/tkwry-wheel-smoke"
          mkdir -p "$SMOKE_DIR"
          SMOKE_PY='import tkwry; import tkwry._core; assert tkwry.__version__ == "'"${TAG_VERSION}"'", tkwry.__version__; print("wheel smoke OK", tkwry.__version__)'
          if [ "${{ matrix.smoke }}" = "rosetta" ]; then
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              arch -x86_64 python -m pip install --upgrade pip
              arch -x86_64 pip install dist/*.whl
              cd "$SMOKE_DIR"
              arch -x86_64 python -c "$SMOKE_PY"
            else
              echo "::warning::Rosetta unavailable; skipping x86_64 wheel import smoke on this runner"
            fi
          else
            python -m pip install --upgrade pip
            pip install dist/*.whl
            cd "$SMOKE_DIR"
            python -c "$SMOKE_PY"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.id }}
          path: dist/*.whl

  verify:
    name: Verify dist (twine + sdist smoke)
    runs-on: ubuntu-latest
    needs: [check-version, sdist, wheels]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: List dist
        shell: bash
        run: ls -la dist/

      - name: Twine check
        run: |
          python -m pip install --upgrade pip
          pip install twine
          twine check dist/*

      - name: Install Linux build dependencies (sdist smoke)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev

      - name: Smoke-test sdist install
        env:
          PKG_CONFIG_PATH: ""
        run: |
          set -euo pipefail
          TAG_VERSION="${{ needs.check-version.outputs.version }}"
          pip install "maturin>=1.0"
          pip install dist/*.tar.gz
          SMOKE_DIR="${RUNNER_TEMP}/tkwry-sdist-smoke"
          mkdir -p "$SMOKE_DIR"
          cd "$SMOKE_DIR"
          python -c "import tkwry; import tkwry._core; assert tkwry.__version__ == '${TAG_VERSION}', tkwry.__version__; print('sdist smoke OK', tkwry.__version__)"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [verify]
    environment:
      name: pypi
      url: https://pypi.org/p/tkwry
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: List dist
        shell: bash
        run: ls -la dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    # After PyPI so a tag cannot leave a GH release without a verified publish path.
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: List dist
        shell: bash
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
