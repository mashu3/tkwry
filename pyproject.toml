[project]
name = "tkwry"
dynamic = ["version"]
description = "Keep Tkinter — embed a real system WebView in your Frame (wry, child-window embedding)"
authors = [
    { name = "mashu3" },
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["tkinter", "webview", "wry", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/mashu3/tkwry"
Repository = "https://github.com/mashu3/tkwry"
Documentation = "https://github.com/mashu3/tkwry/blob/main/docs/usage.md"
"Bug Tracker" = "https://github.com/mashu3/tkwry/issues"
Changelog = "https://github.com/mashu3/tkwry/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "maturin>=1.0",
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["maturin>=1.0,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "."
module-name = "tkwry._core"
features = ["pyo3/abi3-py310"]
exclude = ["**/__pycache__/**", "**/*.py[cod]"]
editable-profile = "release"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP045"]

[tool.ruff.lint.per-file-ignores]
"examples/tkwry_browser.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-v"]
markers = [
    "integration: requires display and native WebView (tests/integration, tests/macos)",
]

# Codecov: measure the checkout copy. Coverage CI must use editable install
# (``maturin develop``); a wheel under site-packages uploads as ~0% on Codecov.
#
# Platform modules for other OSes are omitted at run/report time by
# ``scripts/ci-coverage.sh`` (writes ``.coveragerc``):
#   darwin → omit _linux.py, _win32.py
#   win32  → omit _linux.py, _macos.py
#   linux  → omit _win32.py, _macos.py
# Local ``pytest --cov`` without that helper still omits ``_core.*`` only.
[tool.coverage.run]
source = ["tkwry"]
omit = [
    "*/tkwry/_core.*",
]

[tool.coverage.report]
omit = [
    "*/tkwry/_core.*",
]
# fail_under=90 lives in the generated ``.coveragerc`` from
# ``scripts/ci-coverage.sh`` (platform omits required for an honest bar).

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tkwry._macos", "tkwry._parent"]
ignore_errors = true
